[project]
name = "agent_system"
version = "0.1.0"
description = "生产级Agent系统 - 支持Provider动态切换、记忆系统、LangChain编排、MCP Tools集成"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.20",
    "langgraph>=0.0.20",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "aiohttp>=3.9.0",
    "tenacity>=8.2.0",
    "pybreaker>=1.0.0",
    "structlog>=24.0.0",
    "python-json-logger>=2.0.0",
    "mcp>=1.0.0",
    "mcp-server>=1.0.0",
    "mcp-client>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_system"]
